    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/bootstrap-alert-stage2
          fetch-depth: 0

      - name: Update Alert documentation and API baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Read-Normalized([string] $Path) {
              return [IO.File]::ReadAllText($Path).Replace("`r`n", "`n")
          }

          function Write-Normalized([string] $Path, [string] $Text, [bool] $Bom) {
              $normalized = $Text.Replace("`r`n", "`n").Replace("`n", "`r`n")
              [IO.File]::WriteAllText($Path, $normalized, [Text.UTF8Encoding]::new($Bom))
          }

          function Replace-Exact([string] $Path, [string] $Old, [string] $New, [bool] $Bom = $false) {
              $text = Read-Normalized $Path
              $oldText = $Old.Replace("`r`n", "`n")
              $newText = $New.Replace("`r`n", "`n")
              $first = $text.IndexOf($oldText, [StringComparison]::Ordinal)
              if ($first -lt 0) {
                  throw "Expected text not found in $Path"
              }
              $second = $text.IndexOf($oldText, $first + $oldText.Length, [StringComparison]::Ordinal)
              if ($second -ge 0) {
                  throw "Expected text occurs more than once in $Path"
              }
              $updated = $text.Substring(0, $first) + $newText + $text.Substring($first + $oldText.Length)
              Write-Normalized $Path $updated $Bom
          }

