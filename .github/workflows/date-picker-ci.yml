name: DatePicker CI

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  focused-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run BootstrapDatePicker tests on both target frameworks
        shell: pwsh
        run: |
          $project = "tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj"
          foreach ($framework in @("net48", "net8.0-windows")) {
            dotnet test $project -c Release -f $framework --filter "FullyQualifiedName~BootstrapDatePicker"
            if ($LASTEXITCODE -ne 0) {
              throw "BootstrapDatePicker tests failed for $framework with exit code $LASTEXITCODE."
            }
          }

      - name: Report proposed public API fingerprint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $project = "tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj"
          $approved = "31481edfafc1dbe40f802cb1535c31ab759b674b4b2cad84e5907b90d77173f0"
          $output = & dotnet test $project -c Release -f net8.0-windows --no-restore --filter "FullyQualifiedName~Phase16PublicApiBaselineTests" 2>&1 | Out-String
          $hashes = [regex]::Matches($output, "(?i)\b[0-9a-f]{64}\b") | ForEach-Object { $_.Value.ToLowerInvariant() } | Select-Object -Unique
          $actual = $hashes | Where-Object { $_ -ne $approved } | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($actual)) {
            Write-Host $output
            throw "Could not extract the proposed public API fingerprint."
          }

          @"
          Stage 9 diagnostic API fingerprint: $actual

          This comment is generated by the temporary DatePicker-focused CI and is used only to review/update the intentional public API baseline.
          "@ | Set-Content -Path api-fingerprint-comment.md -Encoding utf8
          gh pr comment $env:PR_NUMBER --body-file api-fingerprint-comment.md
