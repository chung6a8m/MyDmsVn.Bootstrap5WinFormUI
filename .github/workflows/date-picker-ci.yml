name: DatePicker CI

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  focused-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Run BootstrapDatePicker tests on both target frameworks
        shell: pwsh
        run: |
          $project = "tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj"
          foreach ($framework in @("net48", "net8.0-windows")) {
            dotnet test $project -c Release -f $framework --filter "FullyQualifiedName~BootstrapDatePicker"
            if ($LASTEXITCODE -ne 0) {
              throw "BootstrapDatePicker tests failed for $framework with exit code $LASTEXITCODE."
            }
          }

      - name: Report proposed public API fingerprint
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $project = "tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj"
          $approved = "31481edfafc1dbe40f802cb1535c31ab759b674b4b2cad84e5907b90d77173f0"
          $output = & dotnet test $project -c Release -f net8.0-windows --no-restore --filter "FullyQualifiedName~Phase16PublicApiBaselineTests" 2>&1 | Out-String
          $hashes = [regex]::Matches($output, "(?i)\b[0-9a-f]{64}\b") | ForEach-Object { $_.Value.ToLowerInvariant() } | Select-Object -Unique
          $actual = $hashes | Where-Object { $_ -ne $approved } | Select-Object -Last 1
          if ([string]::IsNullOrWhiteSpace($actual)) {
            Write-Host $output
            throw "Could not extract the proposed public API fingerprint."
          }

          @"
          Stage 9 diagnostic API fingerprint: $actual

          This comment is generated by the temporary DatePicker-focused CI and is used only to review/update the intentional public API baseline.
          "@ | Set-Content -Path api-fingerprint-comment.md -Encoding utf8
          gh pr comment $env:PR_NUMBER --body-file api-fingerprint-comment.md

      - name: Patch Stage 9 contract documentation
        shell: pwsh
        run: |
          $componentsPath = "docs/COMPONENTS.md"
          $components = Get-Content -Raw $componentsPath
          if (-not $components.Contains("## BootstrapDatePicker")) {
            $section = @'
          ## BootstrapDatePicker

          Responsibility: provide a Bootstrap-themed date/time input while preserving native WinForms date state, range, formatting, checkbox, keyboard, localized display, and calendar-popup semantics.

          Stage 9 of the component-expansion roadmap finalizes the public concepts as:

          ```text
          BootstrapDatePicker : UserControl

          BootstrapDatePicker.Value
          BootstrapDatePicker.MinDate
          BootstrapDatePicker.MaxDate
          BootstrapDatePicker.Format
          BootstrapDatePicker.CustomFormat
          BootstrapDatePicker.ShowCheckBox
          BootstrapDatePicker.Checked
          BootstrapDatePicker.ValidationState
          BootstrapDatePicker.BorderRadius
          BootstrapDatePicker.ValueChanged
          ```

          Behavior:

          - `BootstrapDatePicker` owns exactly one private native WinForms `DateTimePicker`. The native picker is the single source of truth for `Value`, `MinDate`, `MaxDate`, `Format`, `CustomFormat`, `ShowCheckBox`, `Checked`, localized text, range normalization/exceptions, keyboard navigation, and the calendar popup; the framework does not mirror date state.
          - The wrapper owns the single public tab stop and keeps the private native picker out of the tab sequence. Entering the wrapper or clicking its shell redirects focus to the native picker; native `KeyDown`, `KeyPress`, `KeyUp`, and `PreviewKeyDown` are forwarded through the wrapper exactly once.
          - `ValueChanged` is raised only from the native picker's effective `ValueChanged` path and reports the `BootstrapDatePicker` wrapper as sender. Assigning the same value remains a native no-op, and range-driven value adjustments preserve native event behavior.
          - `Format` directly uses `DateTimePickerFormat.Long`, `Short`, `Time`, or `Custom`; `CustomFormat` is passed through unchanged. Stage 9 adds no custom parser, formatter, culture property, nullable-date model, or parallel text representation.
          - `ShowCheckBox` and `Checked` retain native optional-date checkbox presentation/state. Stage 9 intentionally fixes the owned picker to `ShowUpDown = false` and does not expose `ShowUpDown` publicly.
          - Border priority matches the established input model: disabled presentation wins first; otherwise Valid uses success, Invalid uses danger, neutral focus uses the focus token, and unfocused neutral uses the normal border token. Palette resolution reuses `BootstrapTextBoxRenderLogic` instead of creating a competing validation formula.
          - `BorderRadius = -1` uses the current theme radius; non-negative values specify an explicit logical radius and values below `-1` are rejected before mutation. Radius applies only to the framework-owned outer shell and does not promise rounded OS-owned calendar/dropdown chrome.
          - Shell padding uses current `SpacingXS`; border/focus widths and radius scale through `DpiScaler`. An internal pure layout helper centers the native preferred height inside the shell and clamps narrow/tiny client rectangles without negative geometry.
          - The wrapper paints only its themed surface/border. The native picker paints its own text, checkbox/dropdown affordance, focus/edit internals, and calendar popup. No `MonthCalendar`, custom `Form`, popup host, global hook, P/Invoke, private WinForms reflection, timer, animation engine, or package dependency is introduced.
          - Runtime Light/Dark switches update the shell/native palette and theme-owned `Body` font while preserving native date/range/format/checkbox state. Parent-DPI changes relayout the owned native picker. Caller-assigned fonts remain caller-owned.
          - Designer construction is parameterless and requires no application bootstrap. Disposal detaches native/theme handlers and disposes only framework-created font resources; the owned native picker is disposed through normal WinForms child ownership.

          Manual verification: choose **Advanced Inputs**. Compare Long/Short/Time, custom `yyyy-MM-dd`, custom `yyyy-MM-dd HH:mm`, optional unchecked checkbox, constrained range, Valid/Invalid, disabled, explicit radius, and live `ValueChanged`. Exercise Tab/Shift+Tab, native calendar open/close and arrow/navigation keys, locale-sensitive display, Light/Dark switching, repeated resize, and 100/125/150/175/200% real Windows scaling. The calendar popup and localized native rendering remain WinForms/OS-owned and may differ by Windows/runtime/culture.

          '@
            $components = $components.Replace("## Deferred components", "$section`n## Deferred components")
            $components = $components.Replace("Dialog/Modal, Skeleton, DatePicker, and others are not part of the initial foundation contract.", "Dialog/Modal, Skeleton, and others are not part of the initial foundation contract.")
            Set-Content -Path $componentsPath -Value $components -Encoding utf8
          }

          $testingPath = "docs/TESTING.md"
          $testing = Get-Content -Raw $testingPath
          if (-not $testing.Contains("BootstrapDatePicker Stage 9 pure tests cover:")) {
            $pure = @'
          BootstrapDatePicker Stage 9 pure tests cover:

          - Native `DateTimePicker` default/range/format/custom-format/checkbox characterization without framework assumptions about locale-specific rendered strings
          - Disabled/valid/invalid/focused/neutral border palette priority through the established TextBox validation model
          - Enabled/disabled surface and foreground selection from the current theme
          - Validation-state/radius rejection plus null-theme and invalid-DPI guards before usable output
          - DPI scaling at logical 96/120/144/168/192 for `SpacingXS`, border/focus widths, and theme/explicit radius
          - Native-picker bounds containment for normal, narrow, tiny, empty, and malformed clients without negative rectangles

          '@
            $testing = $testing.Replace("### 2.2 WinForms control tests", "$pure`n### 2.2 WinForms control tests")

            $sta = @'
          BootstrapDatePicker Stage 9 STA tests verify:

          - Designer-safe/native defaults, `DefaultProperty(Value)`, `DefaultEvent(ValueChanged)`, `AccessibleRole.DropList`, and the exact planned public framework member surface
          - Exactly one owned native `DateTimePicker`, wrapper-owned single tab stop, native child `TabStop = false`, and intentionally internal `ShowUpDown = false`
          - Direct forwarding/parity for value, range, `DateTimePickerFormat`, custom format, optional checkbox state, native exceptions, range-driven changes, and effective `ValueChanged` event counts
          - Wrapper focus redirection plus exactly-once native KeyDown/KeyPress/KeyUp/PreviewKeyDown forwarding without a second keyboard/date model
          - Native DropDown/CloseUp calendar transitions remaining available on the owned picker, culture-sensitive native text parity, and no custom calendar/popup/parser surface
          - Runtime Light/Dark shell/font updates while preserving native state; caller-owned font preservation; theme subscription/framework-font cleanup; repeated lifecycle stress
          - Draw/layout smoke for neutral/valid/invalid/disabled/explicit-radius states and pure layout parity without painting over native content
          - Advanced Inputs demo coverage for Long/Short/Time, custom date/date-time, optional unchecked checkbox, constrained range, validation, disabled, explicit radius, live `ValueChanged`, and native-calendar ownership guidance

          Manual BootstrapDatePicker verification remains required on real Windows for calendar popup behavior, locale-sensitive text/formatting, keyboard/focus traversal, and physical DPI rendering because those surfaces are owned by WinForms/Windows rather than the framework shell.

          '@
            $testing = $testing.Replace("## 3. DPI matrix", "$sta`n## 3. DPI matrix")

            $dpi = @'
          DatePicker pure tests cover 96/120/144/168/192 logical shell padding, border/focus widths, radius, and native-picker containment. The Advanced Inputs page remains the OS-level gate for actual `DeviceDpi`, localized native text, checkbox/dropdown affordance, native calendar popup geometry/navigation, focus cues, and physical shell-border rendering; the framework does not replace or normalize the popup.

          '@
            $testing = $testing.Replace("## 4. Theme matrix", "$dpi`n## 4. Theme matrix")

            $theme = @'
          DatePicker owns one direct theme subscription because its wrapper paints the shell and owns a theme-created `Body` font. Theme-matrix tests verify the same native-backed instance preserves value/range/format/custom-format/checkbox state while palette/font/layout update, and disposal returns the static theme-handler count to baseline without disposing caller-owned fonts.

          '@
            $testing = $testing.Replace("## 5. Interaction matrix", "$theme`n## 5. Interaction matrix")
            Set-Content -Path $testingPath -Value $testing -Encoding utf8
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/COMPONENTS.md docs/TESTING.md
          if (-not (git diff --cached --quiet)) {
            git commit -m "docs: finalize BootstrapDatePicker contract"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          }
