name: BootstrapSelect Branch CI

on:
  push:
    branches:
      - feature/bootstrap-select

jobs:
  focused-build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build both target frameworks
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Run BootstrapSelect tests on net48
        shell: pwsh
        run: dotnet test tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj -c Release -f net48 --no-build --filter "FullyQualifiedName~BootstrapSelect"

      - name: Run BootstrapSelect tests on net8.0-windows
        shell: pwsh
        run: dotnet test tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj -c Release -f net8.0-windows --no-build --filter "FullyQualifiedName~BootstrapSelect"

      - name: Run full tests except fingerprint on net48
        shell: pwsh
        run: dotnet test tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj -c Release -f net48 --no-build --filter "FullyQualifiedName!~Phase16PublicApiBaselineTests.ExportedApiMatchesApprovedV1Baseline"

      - name: Run full tests except fingerprint on net8.0-windows
        shell: pwsh
        run: dotnet test tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj -c Release -f net8.0-windows --no-build --filter "FullyQualifiedName!~Phase16PublicApiBaselineTests.ExportedApiMatchesApprovedV1Baseline"

      - name: Review public API fingerprint on net48
        shell: pwsh
        run: dotnet test tests/MyDmsVn.Bootstrap5WinFormUI.Tests/MyDmsVn.Bootstrap5WinFormUI.Tests.csproj -c Release -f net48 --no-build --filter "FullyQualifiedName~Phase16PublicApiBaselineTests.ExportedApiMatchesApprovedV1Baseline"
