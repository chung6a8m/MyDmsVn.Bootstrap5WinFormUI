name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build both target frameworks
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Run tests on both target frameworks
        shell: pwsh
        run: ./test.ps1 -Configuration Release -SkipBuild
